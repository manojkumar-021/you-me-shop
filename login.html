<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Login - You&Me Shop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .login-container {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .login-container img {
            display: block;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .gender {
            margin-bottom: 15px;
        }

        .gender input {
            width: auto;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #333;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Logo -->
        <img src="./images/logo.png" alt="You&Me Shop Logo" width="140">

        <h2>User Login</h2>

        <!-- Login Image -->
        <img src="./images/login-button-click-app-icon-vector-28806677.jpg"
             alt="Login Icon"
             width="100">

        <form>

            <label>Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="Enter phone number" required>

            <label>Gender</label>
            <div class="gender">
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
                <input type="radio" name="gender"> Other
            </div>

            <label>City</label>
            <select name="city">
                <option value="">Select City</option>
                <option>Chennai</option>
                <option>Bangalore</option>
                <option>Mumbai</option>
                <option>Delhi</option>
            </select>

            <input type="submit" value="Login" class="btn">
        </form>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

</body>
</html>
